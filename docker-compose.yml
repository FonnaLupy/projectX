version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: newapp_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1310
      POSTGRES_DB: NewApp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: newapp_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      DB_USER: postgres
      DB_PASSWORD: 1310
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: NewApp
      PORT: 5000
      JWT_SECRET: SECRET_KEY_PROD
      USE_MOCK_DB: "false"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: